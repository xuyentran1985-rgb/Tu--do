<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tủ đồ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tủ Đồ Của Xoen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; True Summer palette for the UI itself */
:root{
  --bg:#F3F2F7; --surface:#FFFFFF; --ink:#24304D; --muted:#6A7088; --line:#E1E0EA;
  --accent:#B4466F; --accent-ink:#FFFFFF; --accent-soft:#F3DDE6;
  --good:#2F7D69; --good-soft:#DDEFE9; --warn:#9A6A12; --warn-soft:#F5EAD3; --bad:#B03F45; --bad-soft:#F6DFE0;
  --shadow:0 1px 2px rgba(36,48,77,.06),0 6px 20px rgba(36,48,77,.06);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15161D; --surface:#1F212B; --ink:#E8E7F1; --muted:#9EA2B6; --line:#2E3040;
  --accent:#E487AC; --accent-ink:#2A1420; --accent-soft:#3A2431;
  --good:#7CCDB6; --good-soft:#1C3330; --warn:#E3B868; --warn-soft:#382D18; --bad:#EE8C90; --bad-soft:#3B2224;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15161D; --surface:#1F212B; --ink:#E8E7F1; --muted:#9EA2B6; --line:#2E3040;
  --accent:#E487AC; --accent-ink:#2A1420; --accent-soft:#3A2431;
  --good:#7CCDB6; --good-soft:#1C3330; --warn:#E3B868; --warn-soft:#382D18; --bad:#EE8C90; --bad-soft:#3B2224;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-style:italic;font-size:26px;line-height:1.1;margin:0}
.brand small{display:block;font-family:var(--f-body);font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.sync{font-size:12px;color:var(--muted);text-align:right}
h2{font-size:17px;margin:0;text-wrap:balance}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.banner{border-radius:12px;background:var(--warn-soft);color:var(--warn);padding:10px 12px;font-size:13px;margin-block:4px 10px}
section{display:flex;flex-direction:column;gap:12px;margin-top:8px}
/* wardrobe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/5;max-width:100%;width:100%;display:grid;place-items:center;position:relative;background:var(--sw-bg,#ddd)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:58%;height:58%}
.item .meta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.item .name{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag-sample{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.88);color:#24304D;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;width:max-content}
.pill.v4{background:var(--good-soft);color:var(--good)}
.pill.v3{background:var(--good-soft);color:var(--good)}
.pill.v2{background:var(--warn-soft);color:var(--warn)}
.pill.v1{background:var(--bad-soft);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.empty{background:var(--surface);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* outfits */
.controls{display:flex;flex-direction:column;gap:6px}
.outfit{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.outfit.hero{border:2px solid var(--accent)}
.outfit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.piece{display:flex;flex-direction:column;gap:4px;min-width:0}
.piece .thumb{border-radius:12px;overflow:hidden;aspect-ratio:1}
.piece .tag-sample{display:none}
.piece span{font-size:11.5px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--good)}
.reasons li.neg::before{background:var(--warn)}
.scorebar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;width:90px}
.scorebar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pinned{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:8px 10px;font-size:13.5px}
.pinned .thumb{width:40px;height:40px;border-radius:8px;overflow:hidden;aspect-ratio:1;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.wx{background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;margin-bottom:6px}
.wx-head{font-weight:600;font-size:15px}
.wx-sub{font-weight:400;color:var(--muted);font-size:12.5px;display:block}
.wx ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pill.style{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip-item{flex:none;width:64px;border:2px solid transparent;border-radius:12px;padding:0;background:none;overflow:hidden}
.strip-item .thumb{aspect-ratio:1;border-radius:10px;overflow:hidden}
.strip-item .tag-sample{display:none}
.strip-item[aria-pressed="true"]{border-color:var(--accent)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk-photo{position:relative;border-radius:14px;overflow:hidden;background:var(--line)}
.chk-photo img{display:block;width:100%;max-height:70vh;object-fit:contain;cursor:crosshair}
.dot{position:absolute;transform:translate(-50%,-50%);pointer-events:none;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;border:2px solid var(--bg);white-space:nowrap}
.pick-now{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;text-align:center}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.swbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--ink)}
.swbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swbtn i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:none}
.fixes{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.fixes ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{display:flex;gap:10px;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow);align-items:flex-start}
.hist-item img{width:64px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.hist-item .meta{flex:1;min-width:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.acc-tip ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.acc-tip{display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:12px;padding:9px 11px;font-size:13.5px}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:50;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 16px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tips{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);font-size:13.5px}
.tips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:4px}
nav.tabs .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;white-space:nowrap;color:var(--muted);padding:6px 0}
nav.tabs .tab[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .tab svg{width:22px;height:22px}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(180,70,111,.35);margin-top:-22px}
.fab svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,32,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.label{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
input[type=text],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
.picker{display:flex;flex-direction:column;gap:6px}
.picker img{width:100%;border-radius:14px;cursor:crosshair;touch-action:manipulation}
.photo-drop{display:flex;gap:12px;align-items:center}
.photo-drop .thumb{width:96px;height:120px;border-radius:14px;overflow:hidden;flex:none}
.photo-drop .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sw{border:2px solid transparent;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.2;color:var(--ink);border-radius:12px;padding-block:4px}
.sw b{display:block;width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.12);position:relative}
.sw b.tranh::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px dashed var(--bad);opacity:.6}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.groupname{font-size:12px;color:var(--muted);margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.verdict{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Tủ đồ của Xoen<small>1m58 · dáng quả lê · True Summer</small></h1>
    <div class="sync" id="sync">Đang mở tủ…</div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Chuyển màn">
  <button class="tab" id="tab-tu" data-tab="tu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5a2 2 0 1 1 2 2c-1 0-2 .6-2 1.6V9M12 9 3 15.5c-.8.6-.4 1.5.5 1.5h17c.9 0 1.3-.9.5-1.5L12 9Z"/></svg>Tủ đồ</button>
  <button class="tab" id="tab-phoi" data-tab="phoi">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.5L12 15l-1.8-4.5L5.5 9l4.7-1.4L12 3ZM18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z"/></svg>Phối đồ</button>
  <button class="fab" id="add" aria-label="Thêm món đồ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" id="tab-mua" data-tab="mua">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Nên mua?</button>
  <button class="tab" id="tab-dl" data-tab="dl">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V5h6v2M9 11v5M15 11v5"/></svg>Du lịch</button>
</nav>
<div id="layer"></div>
<input id="f-restore" type="file" accept="application/json,.json" hidden>

<script>
/* ---------- Kiến thức phối đồ: dáng quả lê, vai ngang, True Summer ---------- */
const COLORS = [
  // nhóm hop: tông lạnh dịu, hợp True Summer
  {id:'trang-nga',name:'Trắng ngà',hex:'#F2EFE8',g:'hop',d:1},
  {id:'xanh-baby',name:'Xanh baby',hex:'#A8C7E7',g:'hop',d:1},
  {id:'lavender',name:'Lavender',hex:'#C4B5DD',g:'hop',d:1},
  {id:'hong-phan',name:'Hồng phấn',hex:'#EBC2CB',g:'hop',d:1},
  {id:'mint',name:'Xanh mint dịu',hex:'#AED6CA',g:'hop',d:1},
  {id:'xam-nhat',name:'Xám nhạt',hex:'#CBCED4',g:'hop',d:1},
  {id:'be-hong',name:'Be hồng',hex:'#D9C4BE',g:'hop',d:1},
  {id:'hong-dau',name:'Hồng dâu',hex:'#C64F79',g:'hop',d:2,accent:true},
  {id:'mam-xoi',name:'Đỏ mâm xôi',hex:'#A93A59',g:'hop',d:2,accent:true},
  {id:'xam-xanh',name:'Xám xanh',hex:'#8B9CAA',g:'hop',d:2},
  {id:'denim',name:'Xanh denim',hex:'#5B7596',g:'hop',d:2},
  {id:'teal-diu',name:'Xanh cổ vịt dịu',hex:'#4E7A80',g:'hop',d:2},
  {id:'navy',name:'Navy',hex:'#25324F',g:'hop',d:3},
  {id:'xam-than',name:'Xám than',hex:'#474C57',g:'hop',d:3},
  {id:'tim-than',name:'Tím mận',hex:'#5C3A5C',g:'hop',d:3,accent:true},
  // trung tính
  {id:'trang',name:'Trắng tinh',hex:'#FFFFFF',g:'tt',d:1},
  {id:'kem',name:'Be kem',hex:'#E6D5B5',g:'tt',d:1},
  {id:'den',name:'Đen',hex:'#141414',g:'den',d:3},
  // tránh: tông ấm, đậm gắt
  {id:'cam',name:'Cam',hex:'#E57328',g:'tranh',d:2,accent:true},
  {id:'vang-nghe',name:'Vàng nghệ',hex:'#D4A01C',g:'tranh',d:2,accent:true},
  {id:'nau-dat',name:'Nâu đất',hex:'#7A4E2D',g:'tranh',d:3},
  {id:'reu',name:'Xanh rêu',hex:'#69692F',g:'tranh',d:3},
  {id:'gach',name:'Đỏ gạch',hex:'#B9502E',g:'tranh',d:2,accent:true},
  {id:'bac',name:'Bạc / vàng trắng',hex:'#C9CDD3',g:'kl',d:1,metal:'hop'},
  {id:'ngoc-trai',name:'Ngọc trai',hex:'#EEEAF0',g:'kl',d:1,metal:'hop'},
  {id:'vang-hong',name:'Vàng hồng',hex:'#E2B4A6',g:'kl',d:1,metal:'tt'},
  {id:'vang-kim',name:'Vàng kim',hex:'#D9B44A',g:'kl',d:2,metal:'tranh'},
  {id:'hoa-tiet',name:'Họa tiết nhiều màu',hex:'conic-gradient(#C4B5DD 0 25%,#A8C7E7 0 50%,#EBC2CB 0 75%,#25324F 0)',g:'tt',d:2,pattern:true},
];
const C = Object.fromEntries(COLORS.map(c=>[c.id,c]));
const DEPTH = {1:'sáng',2:'vừa',3:'tối'};

const CATS = [
  {id:'top',name:'Áo',near:true},
  {id:'bottom',name:'Quần'},
  {id:'skirt',name:'Chân váy'},
  {id:'dress',name:'Váy liền',near:true},
  {id:'outer',name:'Áo khoác',near:true},
  {id:'shoes',name:'Giày dép'},
  {id:'bag',name:'Túi'},
  {id:'acc',name:'Phụ kiện'},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));

const SHAPES = {
  top:{label:'Kiểu cổ / dáng áo',opts:[

function trendNote(i){
  if(!TR)return null;
  for(const p of TR.pieces||[]){ if(p.cat!==i.cat)continue; if((p.shapes&&p.shapes.includes(i.shape))||(p.lengths&&p.lengths.includes(i.length)))return p.note }
  const f=(TR.fabrics||[]).find(f=>f.id===i.fabric); if(f)return f.note;
  const c=(TR.colors||[]).find(c=>c.id===i.color); if(c&&CAT[i.cat]?.near)return c.note;

}
function styleFit(items,id){
  const st=TR&&TR.styles&&TR.styles[id]; if(!st)return {pts:0,why:[]};
  let pts=0; const why=[];
  for(const i of items){
    if(st.colors.includes(i.color))pts+=2;
    if(st.shapes.includes(i.shape)){pts+=2; const o=shapeOf(i); if(o&&why.length<2)why.push(o[1].toLowerCase())}
    if(i.fabric&&st.fabrics.includes(i.fabric))pts+=2;
    if(i.length&&st.lengths.includes(i.length))pts+=1;
  }
  if(st.monochrome&&items.length>1){const d=items.map(i=>C[i.color]?.d); if(items.every(i=>i.color===items[0].color)||d.every(x=>x===d[0])){pts+=4;why.push('phối cùng tông')}}
  return {pts:pts/items.length*2,why};
}
function bestStyle(items){ if(!TR)return null; let b=null; for(const id of Object.keys(TR.styles||{})){const f=styleFit(items,id); if(!b||f.pts>b.pts)b={id,...f}} return b&&b.pts>=4?b:null }

/* Chấm một món đồ theo vóc dáng + màu da */
function rateItem(it){
  let s=60; const pos=[],neg=[];
  const col=C[it.color]; const near=CAT[it.cat]?.near||(it.cat==='acc'&&ACC_NEAR.includes(it.shape));
  if(col&&col.metal){ const close=ACC_NEAR.includes(it.shape);
    if(col.metal==='hop'){s+=18;pos.push(`${col.name} hợp da True Summer, làm da sáng hơn`)}
    else if(col.metal==='tt'){s+=4;pos.push('Vàng hồng dịu, dùng được')}
    else {s-=close?18:8;neg.push(close?'Vàng kim là tông ấm, đeo gần mặt dễ làm da xỉn; ưu tiên bạc':'Vàng kim hơi ấm với da bạn, bạc sẽ hợp hơn')} }
  if(col&&!col.metal){
    if(col.g==='hop'){s+=near?18:10; pos.push(`${col.name} là màu tông lạnh dịu, hợp da True Summer`)}
    else if(col.g==='tranh'){ if(near){s-=25;neg.push(`${col.name} là tông ấm, mặc gần mặt dễ làm da xỉn`)} else {s-=8;neg.push(`${col.name} hơi ấm, chỉ nên dùng điểm xuyết`)} }
    else if(col.g==='den'){ if(near){s-=12;neg.push('Đen tuyền sát mặt làm nổi quầng thâm; thêm vòng cổ bạc hoặc khăn sáng màu')} else {s+=10;pos.push('Màu đen ở thân dưới làm đùi gọn hơn')} }
  }
  const sh=shapeOf(it); if(sh){s+=sh[2]; if(sh[3]) (sh[2]>=0?pos:neg).push(sh[3])}
  if(it.cat==='top'&&col){ if(col.d===1){s+=6;pos.push('Áo sáng màu đưa ánh nhìn lên thân trên')} }
  if(it.cat==='bottom'&&col){
    if(col.d===3){s+=8;pos.push('Quần tối màu làm đùi trông nhỏ hơn')}
    else if(col.d===1){s-=6;neg.push('Quần sáng màu làm đùi trông to hơn')}
    if(it.shape==='skinny'&&col.d===1){s-=10;neg.push('Skinny sáng màu là kiểu nên tránh nhất với dáng quả lê')}
  }
  if((it.cat==='bottom'||it.cat==='skirt')&&it.fabric==='thun'){s-=5;neg.push('Chất thun co giãn bám sát đùi, chọn dáng suông sẽ đỡ hơn')}
  if((it.cat==='bottom'||it.cat==='skirt')&&['kaki','jean'].includes(it.fabric)&&['suong','loe','a','rong'].includes(it.shape)){s+=3;pos.push('Chất đứng form giữ dáng suông, không bám đùi')}
  if(it.cat==='skirt'&&col&&col.d===3){s+=5;pos.push('Chân váy tối màu gọn hông')}
  if((it.cat==='bottom'||it.cat==='skirt')&&it.rise){const r=RISES.find(x=>x[0]===it.rise); if(r){s+=r[2]; if(r[3])(r[2]>=0?pos:neg).push(r[3])}}
  if((it.cat==='skirt'||it.cat==='dress')&&it.length){const l=LENGTHS.find(x=>x[0]===it.length); if(l){s+=l[2]; if(l[3])(l[2]>=0?pos:neg).push(l[3])}}
  s=Math.max(5,Math.min(100,Math.round(s)));
  return {s,pos,neg,v:verdict(s)};
}
function verdict(s){return s>=82?{k:4,t:'Rất hợp'}:s>=66?{k:3,t:'Hợp'}:s>=50?{k:2,t:'Tạm được'}:{k:1,t:'Nên hạn chế'}}

function ink(hex){ if(!hex||hex[0]!=='#')return '#24304D'; const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255; return (r*299+g*587+b*114)/1000>150?'rgba(36,48,77,.55)':'rgba(255,255,255,.75)'}

function mix(hex){ // nền nhạt cùng tông màu món đồ
  if(!hex||hex[0]!=='#')return '#E7E2EE';
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const lum=(r*299+g*587+b*114)/1000;
  const t= lum>200? .0 : .78; const base=lum>200?[214,216,226]:[242,241,246];
  if(lum>200) return `rgb(${base.join(',')})`;
  return `rgb(${Math.round(r+(base[0]-r)*t)},${Math.round(g+(base[1]-g)*t)},${Math.round(b+(base[2]-b)*t)})`;
}

/* ---------- Lưu trữ: ngay trên điện thoại (IndexedDB), có sao lưu ra file ---------- */
const S = {items:[], checks:[], phoi:'goi', mode:'loading', style:(()=>{try{return localStorage.getItem('style')||'all'}catch{return 'all'}})(), tab:'tu', cat:'all', occ:'lam', weather:'nong', pin:null, more:false, editing:null, confirmDel:false, err:''};
let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('tu-do',2);r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains('items'))db.createObjectStore('items',{keyPath:'id'}); if(!db.objectStoreNames.contains('checks'))db.createObjectStore('checks',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode,fn,store='items'){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function initStore(){
  try{
    idb=await openDB();
    S.items=await tx('readonly',st=>st.getAll())||[];
    try{S.checks=(await tx('readonly',st=>st.getAll(),'checks')||[]).sort((a,b)=>b.at-a.at)}catch{}
    S.mode='db';
    await fixAutoNames();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  }catch(e){S.mode='local';S.err='Trình duyệt này không cho lưu dữ liệu (có thể đang ở chế độ ẩn danh). Đồ thêm vào sẽ mất khi đóng trang.'}
  setSync();render();
}
function setSync(){document.getElementById('sync').textContent = S.mode==='loading'?'Đang mở tủ…':`${S.items.length} món · lưu trên máy`}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function memPut(it){const i=S.items.findIndex(x=>x.id===it.id); if(i>=0)S.items[i]=it; else S.items.push(it)}
async function putItem(it){
  if(idb){ try{await tx('readwrite',st=>st.put(it))}catch(e){toast(e&&e.name==='QuotaExceededError'?'Máy hết chỗ lưu, hãy xóa bớt món cũ.':'Chưa lưu được, thử lại nhé.');throw e} }
  memPut(it); setSync(); render();
}
async function patchItem(id,patch){
  const it=S.items.find(x=>x.id===id); if(!it)return; const nx={...it,...patch};
  if(idb){ try{await tx('readwrite',st=>st.put(nx))}catch{toast('Chưa lưu được, thử lại nhé.');return} }
  memPut(nx); render();
}
async function delItem(id){
  if(idb){ try{await tx('readwrite',st=>st.delete(id))}catch{toast('Chưa xóa được, thử lại nhé.');return} }
  S.items=S.items.filter(x=>x.id!==id); setSync(); render();
}
/* Sao lưu / khôi phục */
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'tu-do',version:2,saved:new Date().toISOString(),items:S.items,checks:S.checks})],{type:'application/json'});
  const name='tu-do-sao-luu-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Sao lưu tủ đồ'}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Đã tạo file sao lưu.');
}
async function importBackup(file){
  try{
    const data=JSON.parse(await file.text()); const items=Array.isArray(data)?data:data.items;
    if(!Array.isArray(items))throw 0;
    let n=0; for(const it of items){ if(it&&it.id&&it.cat){ await putItem(it); n++ } }
    if(Array.isArray(data.checks)) for(const c of data.checks){ if(c&&c.id&&c.at&&!S.checks.some(x=>x.id===c.id)) await saveCheck(c,true) }
    toast(`Đã khôi phục ${n} món.`);
  }catch{toast('File này không phải bản sao lưu tủ đồ.')}
}

function fitsOcc(it,occ){return !it.occ||!it.occ.length||it.occ.includes(occ)}
function fitsWeather(it,w){ if(!it.season||it.season==='ca-nam')return true; if(w==='mat')return true; return it.season===w }
function recentlyWorn(it){return it.lastWorn && (Date.now()-it.lastWorn)<3*864e5}
function buildOutfits(){
  const occ=S.occ,w=S.weather;
  const pool=S.items;
  const by=c=>pool.filter(i=>i.cat===c);
  const rated=new Map(S.items.map(i=>[i.id,rateItem(i)]));
  const occOK=i=>fitsOcc(i,occ);
  const tops=by('top'),lows=[...by('bottom'),...by('skirt')],dresses=by('dress');
  const outers=by('outer').filter(occOK).sort((a,b)=>rated.get(b.id).s-rated.get(a.id).s);
  const shoes=by('shoes').filter(occOK).sort((a,b)=>rated.get(b.id).s-rated.get(a.id).s);
  const bags=by('bag').filter(occOK);
  const combos=[];
  const scoreCombo=(main)=>{
    let s=main.reduce((a,i)=>a+rated.get(i.id).s,0)/main.length; const pos=[],neg=[];
    for(const i of main){ if(!occOK(i)){s-=14;neg.push(`${i.name} thường không dùng cho dịp này`)} if(recentlyWorn(i)){s-=10;neg.push(`${i.name} vừa mặc mấy hôm trước`)} }
    for(const i of main){ if(!fitsWeather(i,w)){ s-=8; neg.push(w==='lanh'?`${i.name} là đồ mùa nóng, nhớ khoác thêm áo ngoài`:`${i.name} hơi dày cho trời nóng`) } }
    for(const i of main){ const fn=fabricNote(i,w); if(fn){s+=fn[0]; (fn[0]>=0?pos:neg).push(fn[1])} }
    if(wxRainy()){ for(const i of main){ const ci=C[i.color];
      if((i.cat==='bottom'||i.cat==='skirt')&&ci&&ci.d===1){s-=6;neg.push('Trời Hà Nội có thể mưa, đồ sáng màu phía dưới dễ bẩn')}
      if((i.cat==='skirt'||i.cat==='dress')&&i.length==='maxi'){s-=4;neg.push('Váy dài dễ ướt gấu khi mưa')}
      if(i.cat==='bottom'&&ci&&ci.d===3){s+=3;pos.push('Quần sẫm màu hợp ngày mưa, ít lộ vết bẩn')} } }
    if(main.length===2){
      const [t,b]=main; const ct=C[t.color],cb=C[b.color];
      if(ct&&cb){
        if(ct.d<cb.d){s+=12;pos.push('Trên sáng, dưới tối: kéo ánh nhìn lên, hông và đùi gọn lại')}
        else if(ct.d>cb.d){s-=10;neg.push('Áo tối hơn quần làm thân dưới nổi bật, nên đổi ngược')}
        if(ct.accent&&cb.accent){s-=6;neg.push('Hai màu nổi cùng lúc, hơi rối mắt')}
        if(ct.g==='hop'&&cb.g==='hop'){s+=4;pos.push(`${ct.name} và ${cb.name} cùng bảng màu Summer, nhìn hài hòa`)}
        if(ct.id===cb.id&&!ct.pattern){s+=3;pos.push('Phối đồng màu tạo một đường dọc, trông cao hơn')}
      }
      if(b.rise==='cao'){pos.push('Sơ vin áo vào cạp cao để lộ eo')}
    }
    // dồn ưu điểm của từng món
    for(const i of main){ const r=rated.get(i.id); if(r.pos[0])pos.push(r.pos.find(p=>!p.startsWith(C[i.color]?.name||'§'))||r.pos[0]); if(r.neg[0])neg.push(r.neg[0]) }
    if(TRIP_BONUS){const tb=TRIP_BONUS(main); s+=tb.s; pos.unshift(...tb.pos); neg.push(...tb.neg)}
    // xu hướng
    let tr=0; for(const i of main){const n=trendNote(i); if(n&&tr<6){tr+=3; pos.push(n)}} s+=tr;
    // phong cách
    if(S.style!=='all'&&TR&&TR.styles[S.style]){ const f=styleFit(main,S.style); s+=Math.min(12,f.pts)-5; if(f.pts>=5)pos.unshift(`Đúng chất ${TR.styles[S.style].name.toLowerCase()}${f.why.length?': '+f.why.join(', '):''}`) }
    return {s,pos,neg};
  };
  for(const t of tops)for(const b of lows){ combos.push({main:[t,b],...scoreCombo([t,b])}) }
  for(const d of dresses){ const r=scoreCombo([d]); combos.push({main:[d],...r}) }
  let list=combos;
  if(S.pin){ list=list.filter(c=>c.main.some(i=>i.id===S.pin)) }
  list.sort((a,b)=>b.s-a.s);
  // đa dạng: mỗi món chính xuất hiện tối đa 2 lần
  const used=new Map(),out=[];
  for(const c of list){ if(c.main.some(i=>(used.get(i.id)||0)>=2 && i.id!==S.pin))continue; c.main.forEach(i=>used.set(i.id,(used.get(i.id)||0)+1)); out.push(c); if(out.length>=12)break }
  out.forEach((c,idx)=>{
    c.extra=[];
    if(w!=='nong'&&outers.length){ const o=outers[idx%Math.min(outers.length,2)]; c.extra.push(o); const r=rated.get(o.id); if(r.pos[0]&&w==='lanh')c.pos.push(r.pos[r.pos.length-1]) }
    if(shoes.length){ const low=c.main[c.main.length-1]; const lc=C[low.color];
      const pick=[...shoes].sort((a,b)=>(score(b)-score(a)))[idx%Math.min(shoes.length,2)];
      function score(sh){let v=rated.get(sh.id).s; if(wxRainy()&&['quaimanh','bupbe','deple'].includes(sh.shape))v-=12; if(wxRainy()&&['sneaker','botcao','botthap'].includes(sh.shape))v+=4; const sc=C[sh.color]; if(lc&&sc&&(sc.d===lc.d||sc.id==='be-hong'||sc.id==='kem'))v+=8; return v}
      c.extra.push(pick); const sc=C[pick.color];
      if(sc&&lc&&(sc.d===lc.d))c.pos.push('Giày cùng tông với phần dưới, chân trông dài hơn');
      else if(sc&&(sc.id==='be-hong'||sc.id==='kem'))c.pos.push('Giày màu nude kéo dài chân');
    }
    if(bags.length) c.extra.push(bags[idx%bags.length]);
    // phụ kiện: thắt lưng nhấn eo, khăn khi trời mát/lạnh, 1 món trang sức (ưu tiên bạc)
    const accs=by('acc').filter(occOK).sort((a,b)=>rated.get(b.id).s-rated.get(a.id).s);
    const accWhy=[]; const pickAcc=(types,why)=>{const a=accs.find(x=>types.includes(x.shape)&&!c.extra.includes(x)); if(a){c.extra.push(a); if(why)accWhy.push(why(a))} return a};
    const top=c.main[0], low=c.main[c.main.length-1];
    if(c.main.length===1||low.rise==='cao') pickAcc(['thatlung'],a=>c.main.length===1?`Thêm ${a.name.toLowerCase()} thắt ngang eo váy để khoe eo, giấu hông`:`Sơ vin và thêm ${a.name.toLowerCase()} để nhấn eo, chân trông dài hơn`);
    if(w!=='nong') pickAcc(['khan'],a=>`${a.name} màu ${C[a.color]?.name.toLowerCase()||''} gần mặt giúp da sáng, đỡ lạnh`);
    const tc=C[top.color]; const jewel=pickAcc(['daychuyen','khuyentai','vongtay','nhan'],a=>C[a.color]?.metal==='hop'?`${a.name} ${C[a.color].name.toLowerCase()} hợp da True Summer`:null);
    if(!jewel&&tc&&(tc.g==='den'||(top.shape==='v'||top.shape==='vuong'))&&!accs.length) accWhy.push('Đeo thêm dây chuyền bạc mảnh để làm sáng cổ áo');
    if(S.occ==='lam') pickAcc(['dongho'],null);
    if(w==='nong') pickAcc(['mu','kinh'],null);
    // tủ chưa có phụ kiện phù hợp thì gợi ý bằng chữ
    const has=t=>c.extra.some(x=>x.cat==='acc'&&t.includes(x.shape)); const tip=[];
    const lc=C[low.color], tcol=C[top.color], occ=S.occ, rainy=wxRainy();
    if(!c.extra.some(x=>x.cat==='shoes')){
      let sh;
      if(rainy) sh='giày kín mũi nhọn hoặc bốt cổ thấp màu tối, đế chống trơn';
      else if(w==='lanh'&&lc&&lc.d===3) sh=`bốt cao cổ mũi nhọn màu ${lc.name.toLowerCase()} cùng màu quần, chân trông dài hơn`;
      else if(occ==='lam') sh='giày mũi nhọn gót thấp màu nude, be hồng (kéo dài chân)';
      else if(occ==='hen'||occ==='tiec') sh='giày cao gót mũi nhọn quai mảnh màu nude hoặc bạc';
      else if(occ==='nha') sh='sandal quai mảnh hoặc giày búp bê màu nude';
      else sh='sneaker trắng đế mỏng hoặc giày búp bê mũi nhọn';
      tip.push(sh);
    }
    if(!c.extra.some(x=>x.cat==='bag')){
      const bc=['xam-xanh','navy','hong-phan','be-hong'].find(id=>id!==top.color&&id!==low.color);
      tip.push(occ==='lam'?`túi dáng hộp cỡ vừa màu ${C[bc].name.toLowerCase()}`:occ==='hen'||occ==='tiec'?'túi xách tay nhỏ màu bạc hoặc hồng phấn':occ==='nha'?'túi tote vải màu trắng ngà':`túi đeo chéo nhỏ màu ${C[bc].name.toLowerCase()}`);
    }
    if((c.main.length===1||low.rise==='cao')&&!has(['thatlung'])) tip.push(`thắt lưng bản nhỏ ${lc&&lc.d===3?'cùng màu '+lc.name.toLowerCase():'màu navy'}, khóa bạc, để nhấn eo`);
    if(w!=='nong'&&!has(['khan'])){ const sc=['hong-phan','lavender','xam-xanh','hong-dau','xanh-baby'].find(id=>id!==top.color); tip.push(`khăn quàng ${C[sc].name.toLowerCase()} gần mặt cho da sáng`) }
    if(!has(['daychuyen','khuyentai','vongtay','nhan'])) tip.push(['v','vuong','somi'].includes(top.shape)||c.main.length===1?'dây chuyền bạc mảnh, dài vừa chạm cổ áo':'khuyên tai bạc hoặc ngọc trai nhỏ');
    if(S.occ==='lam'&&!has(['dongho'])) tip.push('đồng hồ dây kim loại bạc');
    if(w==='nong'&&!has(['mu','kinh'])) tip.push('kính râm gọng bạc hoặc mũ cói');
    c.accTip=tip.slice(0,5);
    const aw=accWhy.filter(Boolean).slice(0,2); c.pos=[...[...new Set(c.pos.filter(Boolean))].slice(0,5-aw.length),...aw]; c.neg=[...new Set(c.neg)].slice(0,2);
    c.s=Math.max(5,Math.min(100,Math.round(c.s))); c.styleTag=S.style!=='all'?S.style:bestStyle(c.main)?.id;
  });
  return {out,counts:{tops:tops.length,lows:lows.length,dresses:dresses.length}};
}

function computeAdvice(e){
  const it={...e,id:'__shop'}; const r=rateItem(it); const pos=[...r.pos.slice(0,3)], neg=[...r.neg.slice(0,3)]; let s=r.s;
  const tn=trendNote(it); if(tn){s+=6;pos.push(tn)}
  if(TR){ const sid=S.style!=='all'?S.style:bestStyle([it])?.id; if(sid){const f=styleFit([it],sid); if(f.pts>=5){s+=5;pos.push(`Hợp phong cách ${TR.styles[sid].name.toLowerCase()} bạn thích`)} else if(S.style!=='all'){s-=4;neg.push(`Chưa đúng phong cách ${TR.styles[sid].name.toLowerCase()}`)}} }
  // phối được với bao nhiêu món
  const keep={items:S.items,pin:S.pin}; let partners=0, good=0;
  try{ S.items=[...keep.items,it];
    if(['top','bottom','skirt','dress'].includes(it.cat)){ S.pin='__shop'; const out=buildOutfits().out.filter(c=>c.s>=66); good=out.length; partners=new Set(out.flatMap(c=>c.main.map(x=>x.id)).filter(id=>id!=='__shop')).size }
    else { S.pin=null; good=buildOutfits().out.filter(c=>c.extra.some(x=>x.id==='__shop')).length; partners=good }
  } finally { S.items=keep.items; S.pin=keep.pin }
  if(['top','bottom','skirt','dress'].includes(it.cat)){
    if(it.cat==='dress'){ if(good){s+=6;pos.push('Váy liền mặc được ngay, không cần phối thêm')} }
    else if(partners>=3){s+=10;pos.push(`Phối đẹp được với ${partners} món đang có trong tủ`)}
    else if(partners>=1){s+=4;pos.push(`Phối được với ${partners} món trong tủ`)}
    else {s-=10;neg.push('Chưa phối đẹp được với món nào trong tủ, mua về dễ nằm im')}
  } else if(good){s+=4;pos.push(`Đi kèm được ${good} bộ trong tủ`)}
  const dupes=S.items.filter(x=>x.cat===it.cat&&(x.color===it.color||(C[x.color]?.d===C[it.color]?.d&&x.shape===it.shape)));
  if(dupes.length){s-=8*Math.min(2,dupes.length);neg.push(`Tủ đã có món gần giống: ${dupes.slice(0,2).map(x=>x.name).join(', ')}`)}
  s=Math.max(5,Math.min(100,Math.round(s)));
  let v=s>=80?{k:4,t:'Nên mua'}:s>=62?{k:2,t:'Cân nhắc thêm'}:{k:1,t:'Không nên mua'};
  if(dupes.length&&s>=62){s=Math.min(s,74); v.k=2; v.t='Cân nhắc thêm'}
  return {s,v,pos,neg,dupes:dupes.map(x=>x.id)};
}

  const sc=Math.min(rect.width/cv.width,rect.height/cv.height), ow=cv.width*sc, oh=cv.height*sc, ox=(rect.width-ow)/2, oy=(rect.height-oh)/2;
  const px=(ev.clientX-rect.left-ox)/ow, py=(ev.clientY-rect.top-oy)/oh; if(px<0||px>1||py<0||py>1)return;

      else if(top.d>low.d){s-=6;neg.push('Áo tối hơn quần làm ánh nhìn dồn xuống đùi');fix.push('Đổi sang quần hoặc váy tối màu hơn áo')}
      if(top.d===2&&low.d===2&&top.id!==low.id){s-=2;neg.push('Hai màu cùng độ đậm vừa, hơi nhạt nhòa');fix.push('Cho một món sáng hẳn hoặc tối hẳn để bộ đồ có điểm nhấn')}
      if(top.accent&&low.accent){s-=6;neg.push('Hai màu nổi cùng lúc, hơi rối mắt')}
    }
  }
  if(TR&&top){const t=TR.colors.find(c=>c.id===top.id||(low&&c.id===low.id)); if(t){s+=3;pos.push('Có màu đang là xu hướng mùa này: '+C[t.id].name)}}
  // dáng
  const rongT=f.top==='rong', rongL=f.low==='rong', tuck=f.tuck==='co'||f.tuck==='vat', belt=acc.includes('belt');
  if(lien){
    if(rongT&&!belt){s-=10;neg.push('Váy rộng không chiết eo trông như mặc bao, mất dáng');fix.push('Thắt một chiếc thắt lưng mảnh ngay eo (chỗ nhỏ nhất)')}
    else if(rongT&&belt){s+=6;pos.push('Thắt lưng tạo eo cho váy rộng, rất đúng')}
  } else if(f.top&&f.low){
    if(rongT&&rongL&&!tuck&&!belt){s-=18;neg.push('Áo rộng thả ngoài cùng quần, váy rộng: cả người thành một khối, đây là lý do trông luộm thuộm');fix.push('Sơ vin vạt trước áo vào cạp, để vạt sau thả tự nhiên');fix.push('Hoặc thắt lưng mảnh ở eo để lộ chỗ nhỏ nhất của người')}
    else if(rongT&&rongL&&(tuck||belt)){s+=4;pos.push('Có sơ vin hoặc thắt lưng nên áo rộng vẫn gọn eo')}
    if(f.top==='om'&&f.low==='om'){s-=8;neg.push('Ôm cả trên lẫn dưới làm lộ phần đùi to nhất');fix.push('Đổi sang quần suông hoặc ống rộng, giữ áo ôm')}
    else if(f.top!=='rong'&&f.low!=='om'){s+=10;pos.push('Áo gọn, quần váy suông rộng: cân đối dáng quả lê')}
    if(f.low==='om'&&f.top!=='rong'){s-=6;neg.push('Quần váy ôm sát làm đùi trông to hơn');if(low&&low.d<3)fix.push('Nếu mặc đồ ôm thân dưới, chọn màu thật tối và áo dài phủ hông')}
    if(f.low==='om'&&rongT&&!tuck){s+=3;pos.push('Áo rộng che hông, cân với thân dưới ôm')}
  }
  if(!lien&&tuck&&f.tuck==='co'){s+=4;pos.push('Sơ vin lộ eo, chân trông dài hơn')}
  if(!lien&&f.tuck==='vat'){s+=5;pos.push('Nhét vạt trước vừa gọn eo vừa che bụng, rất hợp')}
  // độ dài và giày
  const flat=f.shoe==='bet'||f.shoe==='sneaker'||f.shoe==='tran';
  if(f.len==='dat'){
    if(flat){s-=10;neg.push('Ống quần váy chạm đất mà đi giày bệt: người thấp đi, gấu dễ bẩn và trông lôi thôi');fix.push('Đi cao gót hoặc đế xuồng 5 đến 7 cm để gấu chỉ chạm gót giày');fix.push('Hoặc lên gấu cho vừa chạm mu bàn chân')}
    else if(f.shoe==='got'){s+=6;pos.push('Quần dài chạm đất với giày cao: chân dài miên man')}
  }
  if(f.len==='mu'&&f.shoe==='got'){s+=6;pos.push('Độ dài vừa chạm mu giày với gót cao, kéo chân dài')}
  if(f.len==='bap'){ if(flat){s-=8;neg.push('Dài đến bắp chân và đi giày bệt cắt ngang chỗ to của chân, trông thấp hơn');fix.push('Đổi sang giày mũi nhọn có gót hoặc giày khoét sâu mu bàn chân')} else {s+=2} }
  if(f.len==='ngan'){s-=5;neg.push('Trên gối làm lộ phần đùi');fix.push('Chọn độ dài ngang gối hoặc dưới gối')}
  if(f.len==='goi'&&f.type==='vay'){s+=4;pos.push('Váy ngang gối che đùi, lộ phần chân thon')}
  if(rongL&&flat&&f.len!=='ca'&&f.len!=='bap'){s-=4;neg.push('Ống rộng với giày bệt hơi làm người thấp, nhất là với chiều cao 1m58')}
  if(f.shoe==='tran'){fix.push('Khi ra ngoài: '+(f.len==='dat'||rongL?'sandal cao gót quai mảnh hoặc giày mũi nhọn có gót, màu nude, bạc hoặc đen':'giày bệt mũi nhọn hoặc sandal quai mảnh màu nude, bạc'))}
  // phụ kiện
  if(!acc.length){s-=4;neg.push('Chưa có phụ kiện nên bộ đồ hơi trống');fix.push('Thêm dây chuyền mảnh bạc hoặc khuyên tai ngọc trai để đưa ánh nhìn lên mặt')}
  else{ if(acc.includes('jewel')){s+=3;pos.push('Trang sức gần mặt giúp ánh nhìn dồn lên trên')} if(acc.length>=2){s+=2} }
  if(!lien&&rongT&&!tuck&&!belt&&f.low&&f.low!=='rong'&&!acc.length){fix.push('Thử xắn tay áo lên khuỷu cho gọn')}
  if(top&&top.d===1&&low&&low.d===3&&!acc.includes('bag')){fix.push('Túi nhỏ màu nối giữa hai màu (ví dụ xám xanh, be hồng) sẽ làm bộ đồ liền mạch')}
  const missing=[!CHK.top&&'màu áo',!lien&&!CHK.low&&'màu quần, váy',!f.top&&'áo rộng hay ôm',!lien&&!f.low&&'quần váy rộng hay ôm',!f.len&&'độ dài',!f.shoe&&'giày'].filter(Boolean);
  s=Math.max(5,Math.min(100,Math.round(s)));
  return {s,pos:[...new Set(pos)].slice(0,5),neg:[...new Set(neg)].slice(0,4),fix:[...new Set(fix)].slice(0,5),missing};
}

}

function askClaude(){
  const f=CHK.fit, r=CHK.result, name=(Q,k)=>{const q=Q_FIT.find(x=>x[0]===k); return q&&f[k]?q[2].find(o=>o[0]===f[k])[1]:'chưa rõ'};
  const txt=`Mình cao 1m58, nặng 56kg, dáng quả lê (đùi to), vai ngang, da True Summer. Hôm nay mình mặc: ${name(Q_FIT,'type')}; màu áo ${C[CHK.top]?.name||'chưa rõ'}${f.type==='lien'?'':`, màu quần/váy ${C[CHK.low]?.name||'chưa rõ'}`}; áo ${name(Q_FIT,'top')}; sơ vin: ${name(Q_FIT,'tuck')}; quần/váy ${name(Q_FIT,'low')}; dài ${name(Q_FIT,'len')}; giày: ${name(Q_FIT,'shoe')}; phụ kiện: ${CHK.acc.map(a=>Q_ACC.find(x=>x[0]===a)[1]).join(', ')||'không'}. App chấm ${r?r.s:'?'}/100. Mình gửi kèm ảnh, bạn nhận xét chi tiết và chỉ cách sửa cho đẹp hơn bằng đồ mình có nhé.`;
  try{navigator.clipboard&&navigator.clipboard.writeText(txt)}catch{}
  toast('Đã chép lời nhắn. Ở Claude, bấm dấu + để gửi kèm ảnh nhé.');
  window.open('https://claude.ai/new?q='+encodeURIComponent(txt),'_blank');
}

    <div class="field"><span class="label">Màu chính</span>${grp('hop','Hợp với bạn')}${grp('tt','Trung tính')}${grp('tranh','Nên tránh gần mặt')}${e.cat==='acc'||e.cat==='bag'||e.cat==='shoes'?grp('kl','Kim loại, trang sức'):''}</div>
    ${r?`<div class="verdict"><span class="pill v${r.v.k}">${r.v.t} · ${r.s}/100</span><ul class="reasons">${r.pos.map(p=>`<li>${esc(p)}</li>`).join('')}${r.neg.map(p=>`<li class="neg">${esc(p)}</li>`).join('')}</ul></div>`:''}
    <div class="field"><span class="label">Mặc vào dịp nào</span><div class="opts">${OCC.map(([k,n])=>`<button type="button" class="chip" data-eocc="${k}" aria-pressed="${e.occ.includes(k)}">${n}</button>`).join('')}</div></div>
    <div class="field"><span class="label">Chất liệu</span><div class="opts">${FABRICS.map(([k,n])=>`<button type="button" class="chip" data-fabric="${k}" aria-pressed="${e.fabric===k}">${n}</button>`).join('')}</div></div>
    <div class="field"><span class="label">Mùa</span><div class="opts">${SEASONS.map(([k,n])=>`<button type="button" class="chip" data-season="${k}" aria-pressed="${e.season===k}">${n}</button>`).join('')}</div></div>
    ${e.shop&&e.advice?`<div class="verdict" id="advice"><span class="pill v${e.advice.v.k}" style="font-size:14px">${e.advice.v.t} · ${e.advice.s}/100</span><ul class="reasons">${e.advice.pos.map(p=>`<li>${esc(p)}</li>`).join('')}${e.advice.neg.map(p=>`<li class="neg">${esc(p)}</li>`).join('')}</ul><div class="row"><button type="button" class="btn ghost small" data-act="shop-buy">Mua rồi, thêm vào tủ</button></div></div>`:''}
    ${e.lastWorn?`<div class="hint">Mặc lần gần nhất: ${new Date(e.lastWorn).toLocaleDateString('vi-VN')} · đã mặc ${e.worn||1} lần</div>`:''}
    <div class="row">
      <button type="submit" class="btn" style="flex:1">${e.shop?(e.advice?'Xem lại tư vấn':'Xem tư vấn'):e.isNew?'Lưu vào tủ':'Lưu thay đổi'}</button>
      ${!e.isNew?`<button type="button" class="btn ghost" data-act="pin">Phối với món này</button>`:''}
    </div>
    ${!e.isNew?(S.confirmDel?`<div class="confirm">Xóa hẳn món này?<button type="button" class="btn danger small" data-act="del-yes">Xóa</button><button type="button" class="btn ghost small" data-act="del-no">Giữ lại</button></div>`:`<div><button type="button" class="btn danger small" data-act="del">Xóa khỏi tủ</button></div>`):''}
  </form></div>`;
  const s=layer.querySelector('.sheet'); s.scrollTop=keepScroll;
}
function readName(){const n=document.getElementById('f-name'); if(n&&S.editing)S.editing.name=n.value}

/* Ảnh: thu nhỏ để lưu nhẹ, và đoán màu từ vùng giữa ảnh */
function handlePhoto(file){
  if(!file)return;
  if(window.createImageBitmap){ createImageBitmap(file,{imageOrientation:'from-image'}).then(bm=>processImage(bm,bm.width,bm.height)).catch(()=>legacyLoad(file)); return }
  legacyLoad(file);
}
function legacyLoad(file){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image(); img.onload=()=>processImage(img,img.naturalWidth,img.naturalHeight); img.onerror=()=>toast('Không đọc được ảnh này, thử ảnh khác nhé.'); img.src=fr.result};
  fr.readAsDataURL(file);
}
/* Màu: đổi sang Lab để so màu giống mắt người */
function toLab(r,g,b){
  const f=c=>{c/=255;return c>0.04045?((c+0.055)/1.055)**2.4:c/12.92};
  let R=f(r),G=f(g),B=f(b);
  let x=(R*0.4124+G*0.3576+B*0.1805)/0.95047, y=R*0.2126+G*0.7152+B*0.0722, z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const h=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116; x=h(x);y=h(y);z=h(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
const PAL_LAB=COLORS.filter(c=>!c.pattern).map(c=>{const v=parseInt(c.hex.slice(1),16);return {id:c.id,lab:toLab(v>>16,v>>8&255,v&255)}});
function nearestColors(r,g,b,k=3){const L=toLab(r,g,b);return PAL_LAB.map(p=>({id:p.id,d:(L[0]-p.lab[0])**2*0.6+(L[1]-p.lab[1])**2+(L[2]-p.lab[2])**2})).sort((a,b)=>a.d-b.d).slice(0,k)}
function guessColors(ctx,w,h){
  const all=ctx.getImageData(0,0,w,h).data, at=(x,y)=>{const i=(y*w+x)*4;return [all[i],all[i+1],all[i+2]]};
  // màu nền: lấy ở viền ảnh
  const edge=[]; for(let x=0;x<w;x+=4){edge.push(at(x,1),at(x,h-2))} for(let y=0;y<h;y+=4){edge.push(at(1,y),at(w-2,y))}
  const med=i=>edge.map(p=>p[i]).sort((a,b)=>a-b)[edge.length>>1]; const bg=toLab(med(0),med(1),med(2));
  // gom màu vùng giữa, bỏ điểm giống nền, bỏ điểm quá chói hoặc quá tối (bóng, lóa)
  const buckets=new Map();
  for(let y=Math.round(h*.15);y<h*.85;y+=3)for(let x=Math.round(w*.15);x<w*.85;x+=3){
    const [r,g,b]=at(x,y); const L=toLab(r,g,b);
    if((L[0]-bg[0])**2+(L[1]-bg[1])**2+(L[2]-bg[2])**2<120)continue;
    const key=(r>>4)+'-'+(g>>4)+'-'+(b>>4); const o=buckets.get(key)||{n:0,r:0,g:0,b:0}; o.n++;o.r+=r;o.g+=g;o.b+=b; buckets.set(key,o);
  }
  let list=[...buckets.values()].sort((a,b)=>b.n-a.n);
  if(!list.length){const [r,g,b]=at(w>>1,h>>1);list=[{n:1,r,g,b}]}
  // gộp các nhóm hàng đầu thành màu chủ đạo
  const top=list.slice(0,6), tot=top.reduce((a,o)=>a+o.n,0);
  const score=new Map();
  for(const o of top){ for(const [j,c] of nearestColors(o.r/o.n,o.g/o.n,o.b/o.n,2).entries()) score.set(c.id,(score.get(c.id)||0)+o.n/tot*(j?0.35:1)) }
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
}
function pickColorAt(ev){
  const e=S.editing, img=ev.target; if(!e||!e.photo||img.tagName!=='IMG')return;
  const rect=img.getBoundingClientRect(), cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
  const x=Math.round((ev.clientX-rect.left)/rect.width*cv.width), y=Math.round((ev.clientY-rect.top)/rect.height*cv.height);
  const d=ctx.getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let r=0,g=0,b=0,n=0; for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
  const c=nearestColors(r/n,g/n,b/n,3); readName(); e.color=c[0].id; e.guess=c[0].id; e.cands=c.map(x=>x.id); e.picking=false; drawSheet();
  toast('Đã lấy màu '+C[c[0].id].name);
}
function processImage(img,iw,ih){ {
    const max=520, k=Math.min(1,max/Math.max(iw,ih));
    const cv=document.createElement('canvas'); cv.width=Math.round(iw*k); cv.height=Math.round(ih*k);
    const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height);
    let data=cv.toDataURL('image/jpeg',.72);
    if(data.length>180000) data=cv.toDataURL('image/jpeg',.5);
    const cands=guessColors(ctx,cv.width,cv.height); const best=cands[0]?C[cands[0]]:null;
    readName(); S.editing.photo=data; S.editing.cands=cands; S.editing.picking=false; if(best){S.editing.guess=best.id; S.editing.color=best.id}
    if(!S.editing.catTouched){S.editing.catGuess='loading'; guessCategory(cv,S.editing)}
    drawSheet();
  }
}

function rotatePhoto(){
  const e=S.editing; if(!e||!e.photo)return; readName();
  const img=new Image(); img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=img.height; cv.height=img.width;
    const ctx=cv.getContext('2d'); ctx.translate(cv.width,0); ctx.rotate(Math.PI/2); ctx.drawImage(img,0,0);
    e.photo=cv.toDataURL('image/jpeg',.8); drawSheet();
    if(!e.isNew){ putItem((({isNew,guess,...it})=>it)(e)).then(()=>toast('Đã xoay và lưu ảnh.')).catch(()=>{}) }
  }; img.src=e.photo;
}
/* Nhận diện loại đồ ngay trên máy (MobileNet, tải lần đầu ~14MB rồi lưu lại) */
const CAT_WORDS={
  top:['jersey','T-shirt','sweatshirt','cardigan','brassiere','pajama','blouse','bulletproof vest'],
  outer:['trench coat','fur coat','lab coat','suit','poncho','cloak','windsor tie'],
  bottom:['jean','blue jean','denim','swimming trunks'],
  skirt:['miniskirt','overskirt','hoopskirt','sarong'],
  dress:['gown','abaya','kimono','vestment'],
  shoes:['sandal','running shoe','loafer','cowboy boot','clog','Loafer','shoe shop'],
  bag:['purse','backpack','mailbag','wallet','plastic bag'],
  acc:['necklace','buckle','sunglasses','sunglass','stole','cowboy hat','sombrero','bonnet','digital watch','analog clock','wall clock','chain','bolo tie'],
};
let mlModel=null, mlLoading=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getModel(){
  if(mlModel)return mlModel;
  if(!mlLoading)mlLoading=(async()=>{await loadScript('ml/tf.min.js');await loadScript('ml/mobilenet.min.js');mlModel=await mobilenet.load({version:2,alpha:1.0,modelUrl:'ml/model.json'});return mlModel})();
  return mlLoading;
}
async function classifyClothes(canvas){
  const m=await getModel(); const preds=await m.classify(canvas,10);
  const score={};
  for(const p of preds){ const name=p.className.toLowerCase();
    for(const [cat,words] of Object.entries(CAT_WORDS)) if(words.some(w=>name.split(',').map(x=>x.trim()).includes(w.toLowerCase()))) score[cat]=(score[cat]||0)+p.probability; }
  const best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  return best&&best[1]>=0.12?best[0]:null;
}
async function guessCategory(canvas,e){
  let cat=null; try{cat=await classifyClothes(canvas)}catch(err){cat=null}
  if(S.editing!==e||e.catTouched)return;
  readName();
  if(cat){e.catGuess=cat; e.cat=cat; e.shape=SHAPES[cat]?.opts[0][0]; if(cat==='bottom'||cat==='skirt')e.rise=e.rise||'cao'; if(cat==='skirt'||cat==='dress')e.length=e.length||'midi'}
  else e.catGuess=false;
  drawSheet();
}
function autoName(it){const base=it.cat==='acc'&&shapeOf(it)?shapeOf(it)[1]:CAT[it.cat].name; return `${base} ${C[it.color]?C[it.color].name.toLowerCase():''}`.trim()}
function isAutoName(n){n=(n||'').trim().toLowerCase(); const bases=[...CATS.map(c=>c.name),...SHAPES.acc.opts.map(o=>o[1])]; return bases.some(c=>COLORS.some(col=>n===`${c} ${col.name}`.toLowerCase()))||bases.some(c=>n===c.toLowerCase())}
async function fixAutoNames(){ // sửa tên tự đặt bị lệch loại (vd. quần mà tên "Áo đen")
  for(const it of S.items){ if(isAutoName(it.name)&&it.name!==autoName(it)) await putItem({...it,name:autoName(it)}).catch(()=>{}) }
}
async function saveSheet(){
  readName(); const e=S.editing;
  if(e.shop){ if(!e.color){toast('Chọn màu chính cho món đồ nhé.');return} e.advice=computeAdvice(e); drawSheet(); setTimeout(()=>document.getElementById('advice')?.scrollIntoView({block:'center',behavior:'smooth'}),50); return }
  if(!e.color){toast('Chọn màu chính cho món đồ nhé.');return}
  if(!e.name.trim()||isAutoName(e.name)) e.name=autoName(e);
  const {isNew,guess,catGuess,catTouched,cands,picking,shop,advice,...it}=e; if(isNew)it.created=Date.now();
  if(isNew) delete it.sample;
  try{ await putItem(it); closeSheet(); toast(isNew?'Đã thêm vào tủ.':'Đã lưu.') }catch{}
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click',async ev=>{
  if(ev.target.id==='pick-img'){pickColorAt(ev);return}
  if(ev.target.id==='chk-img'){chkPick(ev);return}
  const t=ev.target.closest('[data-tab],[data-act],[data-cat],[data-open],[data-occ],[data-w],[data-wear],[data-ecat],[data-shape],[data-rise],[data-len],[data-color],[data-eocc],[data-season],[data-fabric],[data-style],[data-days],[data-scene],[data-pin],[data-phoi],[data-q]');
  if(!t){return}
  const d=t.dataset;
  if(d.act==='scrim'&&ev.target!==t)return;
  if(d.tab){S.tab=d.tab;S.more=false;render();window.scrollTo(0,0);return}
  if(d.cat){S.cat=d.cat;render();return}
  if(d.pin){S.pin=S.pin===d.pin?null:d.pin;S.more=false;render();document.querySelector('.pinned')?.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(d.days){TRIP.days=+d.days;render();return}
  if(d.phoi){S.phoi=d.phoi;render();return}
  if(d.q){const [k,v]=d.q.split(':'); if(k==='acc'){const a=CHK.acc; const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v)} else CHK.fit[k]=CHK.fit[k]===v?undefined:v; CHK.result=null; render(); return}
  if(d.scene){TRIP.scene=d.scene;render();return}
  if(d.style){S.style=d.style;S.more=false;try{localStorage.setItem('style',d.style)}catch{} render();return}
  if(d.occ){S.occ=d.occ;S.more=false;render();return}
  if(d.w){S.weather=d.w;S.weatherManual=true;S.more=false;render();return}
  if(d.open){if(S.editing)return; const it=S.items.find(i=>i.id===d.open); if(it)openSheet(it);return}
  if(d.wear){const ids=d.wear.split(','); for(const id of ids){const it=S.items.find(i=>i.id===id); if(it)await patchItem(id,{lastWorn:Date.now(),worn:(it.worn||0)+1})} toast('Đã ghi lại. Mấy hôm tới app sẽ ưu tiên đồ khác.');return}
  // trong bảng sửa
  if(S.editing){ readName();
    if(d.ecat){S.editing.catTouched=true;S.editing.catGuess=undefined;S.editing.cat=d.ecat; S.editing.shape=SHAPES[d.ecat]?.opts[0][0]; if(d.ecat==='bottom'||d.ecat==='skirt')S.editing.rise=S.editing.rise||'cao'; if(d.ecat==='skirt'||d.ecat==='dress')S.editing.length=S.editing.length||'midi'; drawSheet();return}
    if(d.shape){S.editing.shape=d.shape;drawSheet();return}
    if(d.rise){S.editing.rise=d.rise;drawSheet();return}
    if(d.len){S.editing.length=d.len;drawSheet();return}
    if(d.color){S.editing.color=d.color;drawSheet();return}
    if(d.eocc){const o=S.editing.occ; const i=o.indexOf(d.eocc); i>=0?o.splice(i,1):o.push(d.eocc); drawSheet();return}
    if(d.season){S.editing.season=d.season;drawSheet();return}
    if(d.fabric){S.editing.fabric=S.editing.fabric===d.fabric?undefined:d.fabric;drawSheet();return}
  }
  switch(d.act){
    case 'add': openSheet(null);break;
    case 'close': case 'scrim': closeSheet();break;
    case 'backup': exportBackup();break;
    case 'samples': await addSamples();break;
    case 'rm-samples': await removeSamples();break;
    case 'wx-auto': S.weatherManual=false; if(WX)S.weather=wxKind(WX); render();break;
    case 'trip': TRIP.place=(document.getElementById('f-place')?.value||'').trim(); if(!TRIP.place){toast('Gõ nơi bạn sắp đi nhé.');break} await planTrip(); break;
    case 'shop': openSheet(null,true); break;
    case 'shop-buy': readName(); S.editing.shop=false; S.editing.advice=null; await saveSheet(); break;
    case 'more': S.more=true;render();break;
    case 'chk-which': CHK.picking=d.w2; render(); break;
    case 'chk-rot': chkRotate(); break;
    case 'chk-new': resetCheck(); render(); window.scrollTo(0,0); break;
    case 'chk-go': CHK.result=gradeCheck(); render(); setTimeout(()=>document.getElementById('chk-result')?.scrollIntoView({block:'start',behavior:'smooth'}),50); break;
    case 'chk-save': await saveCheck({id:uid(),at:Date.now(),thumb:CHK.thumb,top:CHK.top,low:CHK.low,fit:{...CHK.fit},acc:[...CHK.acc],s:CHK.result.s,pos:CHK.result.pos,neg:CHK.result.neg,fix:CHK.result.fix}); toast('Đã lưu vào lịch sử trả bài.'); resetCheck(); render(); document.getElementById('hist')?.scrollIntoView({block:'start',behavior:'smooth'}); break;
    case 'chk-ask': askClaude(); break;
    case 'chk-del': await delCheck(d.id); break;
    case 'unpin': S.pin=null;render();break;
    case 'rot': rotatePhoto();break;
    case 'pick': readName(); S.editing.picking=!S.editing.picking; drawSheet(); if(S.editing.picking)setTimeout(()=>document.getElementById('pick-img')?.scrollIntoView({block:'center',behavior:'smooth'}),50); break;
    case 'rm-photo': delete S.editing.photo; delete S.editing.guess; drawSheet();break;
    case 'pin': S.pin=S.editing.id; closeSheet(); S.tab='phoi'; S.more=false; render(); window.scrollTo(0,0);break;
    case 'del': S.confirmDel=true;drawSheet();break;
    case 'del-no': S.confirmDel=false;drawSheet();break;
    case 'del-yes': {const id=S.editing.id; closeSheet(); if(S.pin===id)S.pin=null; await delItem(id); toast('Đã xóa.');break}
  }
});
document.getElementById('add').addEventListener('click',()=>openSheet(null));
document.addEventListener('input',e=>{if(e.target.id==='f-place'){TRIP.place=e.target.value; if(!TRIP.scene){const g=guessScene(TRIP.place); document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===g))}}});
document.addEventListener('change',e=>{if(e.target.id==='f-photo')handlePhoto(e.target.files[0]); if(e.target.id==='f-check'&&e.target.files[0]){chkPhoto(e.target.files[0]);e.target.value=''} if(e.target.id==='f-restore'&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{e.preventDefault(); if(e.target.id==='sheet')saveSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.editing)closeSheet()});
let tt; function toast(m){let el=document.querySelector('.toast'); if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)} el.textContent=m; clearTimeout(tt); tt=setTimeout(()=>el.remove(),2800)}

render(); initStore(); loadWeather(); loadTrends();

if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    setInterval(check,30*60*1000);
  }).catch(()=>{});
  // có bản mới: báo để bấm cập nhật
  let hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController){hadController=true;return}
    const b=document.createElement('button'); b.className='update-bar'; b.textContent='Có bản mới của app. Bấm để cập nhật';
    b.onclick=()=>location.reload(); document.body.appendChild(b);
  });
}
